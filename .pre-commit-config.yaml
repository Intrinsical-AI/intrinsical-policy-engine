# Pre-commit hooks for Intrinsical Policy Engine
# See https://pre-commit.com for more information
repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check project and dependency lock agree
        entry: uv lock --check --offline
        language: system
        pass_filenames: false
        always_run: true
        files: ^(pyproject\.toml|uv\.lock)$
      - id: ruff
        name: Ruff from the project lock
        entry: uv run --locked ruff check src tests scripts
        language: system
        pass_filenames: false
        always_run: true
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format from the project lock
        entry: uv run --locked ruff format --check src tests scripts
        language: system
        pass_filenames: false
        always_run: true
        types_or: [python, pyi]
      - id: mypy
        name: Mypy from the project lock
        entry: uv run --locked mypy src scripts
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/
      - id: schema-sync
        name: Versioned schema exports match the models
        entry: uv run --locked python scripts/export_schemas.py --out-dir docs/schemas --check
        language: system
        pass_filenames: false
        always_run: true
