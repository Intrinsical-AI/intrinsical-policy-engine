derivations:
- id: STARTER-DERIVE-REVIEW-FROM-AUTOMATION
  when:
    has: starter.automated_decision
  set_flags:
  - starter.needs_review
- id: STARTER-DERIVE-REVIEW-FROM-DATA
  when:
    has: starter.sensitive_data
  set_flags:
  - starter.needs_review
stops: []
classifiers:
  role_mapping: []
  risk_tiers:
  - id: starter_review
    priority: 10
    when:
      has: starter.needs_review
    output:
      tier: review
      regimes:
      - starter
  outcome_rules:
  - id: starter_review_outcome
    outcome: starter_review
    when:
      has: starter.needs_review
