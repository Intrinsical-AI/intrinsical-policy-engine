[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intrinsical-policy-engine"
version = "3.0.0"
description = "Framework-neutral policy/rules assessment engine and export toolkit"
readme = "README.md"
authors = [{ name = "Pablo P.C." }]
requires-python = ">=3.11"
keywords = ["policy-engine", "rules-as-code", "assessment", "audit", "traceability", "CLI", "YAML"]
license = "MPL-2.0"
dependencies = [
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "pydantic>=2.12.3",
    "packaging>=25.0",
]

[project.scripts]
ipe = "intrinsical_policy_engine.app.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.5.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "hypothesis>=6.100.0",
    "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["intrinsical_policy_engine*"]
namespaces = false

[tool.setuptools.package-data]
intrinsical_policy_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "B", "C90", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["E501"]
"demos/**/*" = ["E501"]
"scripts/check_public_release.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]

[tool.coverage.report]
fail_under = 90

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
