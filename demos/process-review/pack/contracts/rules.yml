derivations:
- id: process.derive_intake
  when:
    has: process.submitted
  set_flags:
  - process.intake_required
- id: process.derive_review
  when:
    has: process.review_requested
  set_flags:
  - process.review_required
- id: process.derive_approval
  when:
    has: process.approval_requested
  set_flags:
  - process.approval_required
stops:
- id: process.stop_owner_missing
  when:
    has: process.owner_missing
  outcome: process.blocked
classifiers:
  role_mapping:
  - id: process.coordinator_role
    when:
      has: process.submitted
    roles:
    - process.coordinator
  risk_tiers:
  - id: process.stage_approval
    priority: 30
    when:
      has: process.approval_required
    output:
      tier: process.approval
      regimes:
      - process.mock
  - id: process.stage_review
    priority: 20
    when:
      has: process.review_required
    output:
      tier: process.review
      regimes:
      - process.mock
  - id: process.stage_intake
    priority: 10
    when:
      has: process.intake_required
    output:
      tier: process.intake
      regimes:
      - process.mock
  outcome_rules:
  - id: process.outcome_signoff
    when:
      has: process.approval_required
    outcome: process.ready_for_signoff
  - id: process.outcome_review
    when:
      all:
      - has: process.review_required
      - not:
          has: process.approval_required
    outcome: process.review_pending
  - id: process.outcome_intake
    when:
      all:
      - has: process.intake_required
      - not:
          has: process.review_required
    outcome: process.intake_only
